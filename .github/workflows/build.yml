name: Build AeroSynth VST3

on:
  workflow_dispatch:   # lets you click a "Run workflow" button manually
  push:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest   # GitHub gives you a free Windows PC with the compiler already installed

    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Clone JUCE (including its VST3 SDK submodule)
        run: git clone --depth 1 --recurse-submodules https://github.com/juce-framework/JUCE.git

      - name: Configure with CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Find the built .vst3
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Filter "AeroSynth.vst3" | ForEach-Object { Write-Host $_.FullName }

      - name: Upload the .vst3 as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: AeroSynth-vst3-windows
          path: build/AeroSynth_artefacts/Release/VST3/AeroSynth.vst3
